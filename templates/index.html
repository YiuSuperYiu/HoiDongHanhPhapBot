<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoPilot Studio</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel settings">
        <h1>RoPilot Studio</h1>
        <p class="subtitle">Chat với Claude bằng API key của bạn.</p>

        <label>Claude API Key</label>
        <input id="apiKey" type="password" placeholder="sk-ant-..." />

        <label>Model</label>
        <input id="model" type="text" value="claude-3-5-sonnet-20241022" />

        <label>System Prompt</label>
        <textarea id="systemPrompt" rows="4" placeholder="Bạn là trợ lý hữu ích..."></textarea>

        <label>Temperature</label>
        <input id="temperature" type="number" min="0" max="1" step="0.1" value="0.7" />
      </section>

      <section class="panel chat">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <textarea id="prompt" rows="3" placeholder="Nhập nội dung... (Ctrl+Enter để gửi)"></textarea>
          <button id="sendBtn">Gửi</button>
        </div>
        <p id="status" class="status"></p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
